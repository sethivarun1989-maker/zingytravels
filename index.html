<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zingy Travels – Holidays, Tours & Experiences</title>

<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}

body {

    font-family: Arial, Helvetica, sans-serif;

    background: #fff;

    color: #12233f;

}

header {

    height: 140px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 25px 28px;

    border-bottom: 1px solid #eee;

    background: #fff;

}

.logo {

    font-size: 42px;

    font-weight: 900;

    letter-spacing: -3px;

    color: #1686d9;

}

.logo span {

    color: #152c4b;

}

.tagline {

    margin-top: 5px;

    font-size: 10px;

    letter-spacing: 6px;

    color: #7c8798;

    font-weight: 700;

}

.header-right {

    display: flex;

    align-items: center;

    gap: 25px;

}

.phone {

    font-size: 42px;

}

.menu {

    width: 55px;

    display: flex;

    flex-direction: column;

    gap: 7px;

}

.menu span {

    height: 7px;

    width: 52px;

    background: #142b48;

    border-radius: 10px;

}

.container {

    padding: 12px 25px 45px;

}

.grid {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 16px;

}

.card {

    height: 330px;

    position: relative;

    overflow: hidden;

    border-radius: 30px;

    background: #ddd;

    cursor: pointer;

}

.card img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}

.card::after {

    content: "";

    position: absolute;

    inset: 0;

    background: linear-gradient(

        to top,

        rgba(0,0,0,.75),

        rgba(0,0,0,.05) 70%

    );

}

.card-title {

    position: absolute;

    left: 26px;

    bottom: 25px;

    color: white;

    font-size: 31px;

    line-height: .95;

    font-weight: 900;

    z-index: 2;

    max-width: 78%;

    text-shadow: 0 2px 5px rgba(0,0,0,.4);

}

.arrow {

    position: absolute;

    right: 22px;

    bottom: 24px;

    width: 72px;

    height: 72px;

    border-radius: 50%;

    background: white;

    z-index: 3;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    color: #12233f;

}

.call-button {

    position: fixed;

    right: 25px;

    bottom: 35px;

    width: 85px;

    height: 85px;

    border-radius: 50%;

    background: #14e86f;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 43px;

    z-index: 20;

    box-shadow: 0 5px 20px rgba(0,0,0,.2);

    text-decoration: none;

}

@media (max-width: 600px) {

    header {

        height: 135px;

        padding: 22px 26px;

    }

    .logo {

        font-size: 38px;

    }

    .tagline {

        font-size: 9px;

        letter-spacing: 4px;

    }

    .phone {

        font-size: 36px;

    }

    .menu {

        width: 50px;

    }

    .menu span {

        width: 50px;

        height: 7px;

    }

    .container {

        padding: 12px 25px 40px;

    }

    .grid {

        gap: 16px;

    }

    .card {

        height: 330px;

        border-radius: 28px;

    }

    .card-title {

        font-size: 29px;

        left: 25px;

        bottom: 25px;

    }

    .arrow {

        width: 70px;

        height: 70px;

        right: 20px;

        bottom: 22px;

        font-size: 38px;

    }

}

@media (max-width: 390px) {

    .container {

        padding-left: 16px;

        padding-right: 16px;

    }

    .grid {

        gap: 12px;

    }

    .card {

        height: 290px;

    }

    .card-title {

        font-size: 25px;

        left: 18px;

    }

    .arrow {

        width: 58px;

        height: 58px;

        font-size: 32px;

        right: 12px;

    }

}

</style>

</head>
